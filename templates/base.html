<!doctype html>
<html>
    <head>
        <title>My Gaming Diary</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>
    <body
        class="bg-linear-to-r from-indigo-500 from-10% via-sky-500 via-30% to-emerald-500 to-90% text-white min-h-screen font-serif flex flex-col"
    >
        {% if session.user_id %}
        <nav class="font-extralight text-lg flex justify-end gap-4 mr-8 pt-4">
            <a
                href="/"
                id="navhome"
                class="hover:text-blue-800 group transition duration-300"
                >Home<span
                    class="block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-blue-800"
                ></span
            ></a>
            <a
                href="/stats"
                id="navstats"
                class="hover:text-blue-800 group transition duration-300"
                >Stats<span
                    class="block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-blue-800"
                ></span
            ></a>
            <a
                href="/auth/logout"
                class="hover:text-blue-800 group transition duration-300"
                >Logout<span
                    class="block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-blue-800"
                ></span
            ></a>
        </nav>
        {% endif %}
        {% block content %}{% endblock %}
        {% if session.user_id %}
        <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
        {% endif %}
    </body>
</html>
